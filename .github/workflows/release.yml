name: Release

on:
  workflow_dispatch:
  pull_request:
    branches: [main, develop]
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check release tag matches package version
        shell: bash
        run: |
          release_version="$(awk '/^version:/ {print $2; exit}' pubspec.yaml)"
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF_NAME" != "v$release_version" ]]; then
            echo 'Release tag does not match pubspec.yaml version.' >&2
            exit 1
          fi
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.13.2"
      - run: bash scripts/release_preflight.sh

  build:
    needs: validate
    strategy:
      matrix:
        include:
          - os: macos-15
            artifact_glob: "dist/*.tar.gz"
            script: "bash scripts/package_release.sh"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.13.2"
      - run: dart pub get
      - run: ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: boundarylens-${{ matrix.os }}
          path: ${{ matrix.artifact_glob }}

  build-idea-plugin:
    needs: build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.13.2"
      - uses: actions/download-artifact@v4
        with:
          path: native-artifacts
          merge-multiple: true
      - name: Extract same-run native artifacts
        run: |
          mkdir -p dist
          for archive in native-artifacts/*.tar.gz; do
            tar -xzf "$archive" -C dist
          done
      - name: Validate macOS ARM64 distribution and build IDEA plugin
        run: bash scripts/idea_plugin_preflight.sh
      - uses: actions/upload-artifact@v4
        with:
          name: boundarylens-idea-plugin
          path: idea-plugin/build/distributions/boundarylens-idea-*.zip
          if-no-files-found: error

  publish-github-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, build-idea-plugin]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          generate_release_notes: true
