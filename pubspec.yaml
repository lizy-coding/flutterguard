name: boundarylens_cli
description: Project-declared module boundary and public entry checks for Dart, with JSON/SARIF reports and IntelliJ integration.
version: 0.7.1
repository: https://github.com/lizy-coding/BoundaryLens
issue_tracker: https://github.com/lizy-coding/BoundaryLens/issues
topics:
  - static-analysis
  - flutter
  - architecture
  - cli

environment:
  sdk: ^3.11.5

dependencies:
  analyzer: ^7.3.0
  args: ^2.5.0
  glob: ^2.1.2
  path: ^1.9.0
  yaml: ^3.1.2

executables:
  boundarylens: boundarylens

dev_dependencies:
  lints: ^3.0.0
  test: ^1.25.8
